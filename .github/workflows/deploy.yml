name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Parallele Deployments auf dieselbe Worker-Umgebung vermeiden.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Baut (vite build) und lädt hoch (wrangler deploy) — derselbe Befehl
      # wie lokal, damit CI und Arbeitsplatz nicht auseinanderlaufen.
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
